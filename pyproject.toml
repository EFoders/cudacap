[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voacap-gpu"
version = "0.0.1"
description = "GPU rewrite of VOACAP HF propagation prediction (PyTorch), validated module-by-module against the Fortran oracle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cupy-cuda12x[ctk]>=14.1.1",
    "numpy>=1.26",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

# RTX 5080 (Blackwell, sm_120) requires CUDA 12.8+ builds of torch;
# the default PyPI wheels for Windows are CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py runtime assets that MUST ship in the wheel, or an installed
# voacap_gpu cannot run: the NVRTC CUDA kernels compiled at runtime, and the
# CCIR/URSI coefficient data predict() reads to build the ionosphere.
[tool.setuptools.package-data]
voacap_gpu = [
    "cuda/kernels/*.cuh",
    "cuda/*.md",
    "data/coeffs/*.asc",
    "data/coeffs/*.md",
]
